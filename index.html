                    <article>
                        <h2>Bienvenidos a FUNJOVIR</h2>
                        <img src="img/Inicio/mamá e hijo.jpeg" alt="Madre e hijo beneficiarios de la Fundación FUNJOVIR en Bucaramanga" style="width:100%; margin:10px 0">
                        <p>La Fundación FUNJOVIR es una organización sin ánimo de lucro dedicada a promover el desarrollo juvenil y la inclusión social en comunidades vulnerables de Bucaramanga. Desde nuestra creación, hemos trabajado incansablemente para brindar oportunidades de crecimiento y bienestar a jóvenes y familias.</p>
                        <p>En FUNJOVIR, ofrecemos programas educativos, deportivos y de emprendimiento para cientos de jóvenes en Bucaramanga. Nuestro objetivo es reducir la brecha social y brindar herramientas para un futuro mejor.</p>
                    </article>
                </div>

                <!-- Página Nosotros -->
                <div id="nosotros" class="page">
                    <article>
                        <h2>Quiénes Somos – Fundación FUNJOVIR</h2>
                        <img src="img\Nosotros\nosotros 1.jpeg" alt="Equipo FUNJOVIR">
                        <p>FUNJOVIR nace en el 2015 del sueño de un grupo de amigos por querer cambiar el mundo o al menos una porción de él, ubicada el barrio Villa Rosa en la Comuna 1 Norte de la hermosa ciudad de Bucaramanga - Santander,  Los cuales deciden conformar la Fundación el 27 de junio de 2015 con el fin único de rescatar a los niños y jóvenes en situación de vulnerabilidad y ofrecerles junto a sus familias, una mejor opción de vida, basada en la formación integral de los niños y jóvenes y en el aprovechamiento de su tiempo libre en actividades recreativas, culturales, deportivas y formativas. barrio Villa Rosa. Hemos impactado positivamente a más de 10,000 personas a través de nuestros programas educativos, deportivos y de emprendimiento. FUNJOVIR, persigue fines de beneficencia, el interés o utilidad común y el mejoramiento de la calidad de vida, el bienestar común o de interés social con fines RECREATIVOS, DEPORTIVOS, EDUCATIVOS, TECNOLÓGICOS, INVESTIGATIVOS, ASISTENCIALES, SERVICIO SOCIAL Y CULTURALES.</p>
                        <h3>Nuestra Historia</h3>
                        <p>Iniciamos con un grupo de cinco (5) voluntarios que decidieron hacer la diferencia en su comunidad. Hoy somos más de 15 colaboradores y 50 voluntarios activos.</p>
                        <h3>Misión: Impactar a jóvenes vulnerables</h3>
                        <p>Transformar vidas a través de programas integrales que fomenten el desarrollo humano, la educación de calidad y la inclusión social.</p>
                        <h3>Visión: Ser líderes en inclusión juvenil</h3>
                        <p>Ser reconocidos en 2030 como la fundación líder en el norte de Bucaramangaa en la generación de oportunidades para jóvenes.</p>
                        <h3>Nuestros Valores</h3>
                        <ul>
                            <li><strong>Compromiso:</strong> Dedicación total a nuestra causa social.</li>
                            <li><strong>Transparencia:</strong> Gestión clara y rendición de cuentas.</li>
                            <li><strong>Inclusión:</strong> Espacios para todos sin discriminación.</li>
                            <li><strong>Innovación:</strong> Buscamos nuevas formas de generar impacto.</li>
                            <li><strong>Solidaridad:</strong> Trabajamos unidos por un mismo objetivo.</li>
                        </ul>
                    </article>
                </div>

                        <h2>Nuestros Programas</h2>
                        <img src="img\Programas\deportes\deportes 1.jpeg" alt="Programas educativos">
                        <h3>📚 Educación para el Futuro – Becas y refuerzo escolar</h3>
                        <img src="img\Programas\deportes\deportes 2.jpeg" alt="Programas educativos">
                        <p>Programa de becas y refuerzo escolar para jóvenes en situación de vulnerabilidad. Incluye tutorías, materiales educativos y acompañamiento psicosocial. Más de 2,000 jóvenes beneficiados anualmente.</p>
                        <h3>💼 Emprendimiento Juvenil</h3>
                        <p>Capacitación en habilidades empresariales, talleres de innovación y acceso a microcréditos para que los jóvenes puedan crear sus propios emprendimientos. 150+ negocios creados.</p>
                        <h3>⚽ Deporte y Recreación</h3>
                        <p>Escuelas deportivas en fútbol, baloncesto y artes marciales que fomentan valores como el trabajo en equipo, la disciplina y la sana competencia.</p>
                        <h3>💻 Inclusión Digital</h3>
                        <p>Talleres de alfabetización digital, programación y robótica para cerrar la brecha tecnológica en comunidades marginadas.</p>

                        <p>Ser voluntario en FUNJOVIR es una experiencia transformadora. Tu tiempo y talento pueden marcar la diferencia en la vida de muchos jóvenes.</p>
